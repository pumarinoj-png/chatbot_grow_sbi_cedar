<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Práctica de conversaciones</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF0F4; --surface:#FFFFFF; --ink:#17233A; --muted:#5A667B; --line:#D3DAE4; --soft:#F5F7FA;
  --grow:#1F7A5C; --sbi:#2456A6; --cedar:#8A3F7B;
  --accent:#2456A6;
  --display:'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',sans-serif;
  --body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html{scroll-padding-top:16px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55}
[hidden]{display:none!important}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:700;line-height:1.15;margin:0}

.top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;max-width:1080px;margin:0 auto;padding:22px 24px 0}
.brand{font-family:var(--display);font-weight:700;font-size:18px}
.stepper{display:flex;gap:6px;list-style:none;margin:0;padding:0;font-size:14px;color:var(--muted)}
.stepper li{padding:4px 12px;border-radius:999px;border:1px solid transparent}
.stepper li[aria-current="step"]{background:var(--ink);color:#fff;font-weight:600}
.stepper li.done{color:var(--ink)}
main{max-width:1080px;margin:0 auto;padding:28px 24px 56px}

/* Paso 1 */
.lead{max-width:640px;margin-bottom:28px}
.lead h1{font-size:clamp(28px,4vw,40px);margin-bottom:10px}
.lead p{margin:0;color:var(--muted);font-size:18px}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.card{display:flex;flex-direction:column;text-align:left;background:var(--surface);border:1px solid var(--line);border-top:5px solid var(--c);border-radius:14px;padding:22px;cursor:pointer;transition:transform .15s,box-shadow .15s,border-color .15s}
.card:hover{transform:translateY(-3px);box-shadow:0 10px 24px -14px rgba(23,35,58,.45);border-color:var(--c)}
.card .acr{font-family:var(--display);font-weight:700;font-size:clamp(44px,6vw,60px);letter-spacing:.01em;color:var(--c);line-height:1}
.card .expand{font-size:14px;color:var(--muted);margin:8px 0 16px}
.card h2{font-size:20px;margin-bottom:8px}
.card p{margin:0 0 20px;color:var(--ink)}
.card .go{margin-top:auto;font-weight:600;color:var(--c)}

/* Paso 2 */
.formwrap{max-width:760px}
.backlink{background:none;border:0;padding:0;color:var(--muted);cursor:pointer;text-decoration:underline;text-underline-offset:3px;margin-bottom:18px}
.formhead{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:6px}
.formhead .acr{font-family:var(--display);font-weight:700;font-size:38px;color:var(--accent)}
.formhead h1{font-size:26px}
.sub{color:var(--muted);margin:0 0 24px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:24px}
.field{margin-bottom:20px}
.field:last-child{margin-bottom:0}
.field label,.field .lbl{display:block;font-weight:600;margin-bottom:2px}
.hint{display:block;color:var(--muted);font-size:14.5px;margin-bottom:8px}
input[type=text],textarea,select{width:100%;padding:11px 13px;border:1px solid #B9C2D0;border-radius:9px;background:#fff;line-height:1.45}
textarea{resize:vertical;min-height:76px}
input:focus,textarea:focus,select:focus{border-color:var(--accent)}
.pautahead{margin:30px 0 14px}
.pautahead h2{font-size:22px;margin-bottom:4px}
.pautahead p{margin:0;color:var(--muted)}
.step-row{display:grid;grid-template-columns:44px 1fr;gap:14px;padding:18px 0;border-top:1px solid var(--line)}
.step-row:first-of-type{border-top:0}
.badge{width:44px;height:44px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:20px}
.badge.sm{font-size:17px}
.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:26px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;border-radius:10px;border:1px solid #B9C2D0;background:#fff;font-weight:600;cursor:pointer;transition:background .15s,border-color .15s}
.btn:hover{background:var(--soft);border-color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn.quiet{border-color:transparent;background:transparent;color:var(--muted)}
.btn.quiet:hover{background:#E3E8EF;color:var(--ink)}

/* Paso 3 */
.chatgrid{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:20px;align-items:start}
.chat{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:14px;height:min(680px,calc(100vh - 150px));min-height:480px;overflow:hidden}
.chathead{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line)}
.avatar{width:42px;height:42px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:18px;flex:none}
.chathead .who{font-weight:600;line-height:1.2}
.chathead .role{font-size:14px;color:var(--muted)}
.log{flex:1;overflow-y:auto;padding:20px 18px;display:flex;flex-direction:column;gap:10px;background:var(--soft)}
.msg{max-width:78%;padding:10px 14px;border-radius:14px;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.user{align-self:flex-end;background:var(--accent);color:#fff;border-bottom-right-radius:4px}
.msg.them{align-self:flex-start;background:#fff;border:1px solid var(--line);border-bottom-left-radius:4px}
.note{align-self:center;text-align:center;color:var(--muted);font-size:14.5px;max-width:420px;margin:auto}
.typing{align-self:flex-start;display:flex;gap:5px;padding:14px 16px;background:#fff;border:1px solid var(--line);border-radius:14px;border-bottom-left-radius:4px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:blink 1.1s infinite ease-in-out}
.typing i:nth-child(2){animation-delay:.18s}.typing i:nth-child(3){animation-delay:.36s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
.errorbar{margin:0;padding:10px 18px;background:#FDECEC;color:#8A1F1F;font-size:14.5px;border-top:1px solid #F3C4C4}
.composer{display:flex;gap:10px;align-items:flex-end;padding:12px 14px;border-top:1px solid var(--line);background:#fff}
.composer textarea{min-height:44px;max-height:140px;resize:none}
.side{display:flex;flex-direction:column;gap:14px}
.side .btn{width:100%}
.tools{display:flex;flex-direction:column;gap:10px}
.mypauta{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px 16px}
.mypauta summary{cursor:pointer;font-weight:600;padding:12px 0}
.mypauta dl{margin:0 0 12px}
.mypauta dt{font-weight:600;font-size:14.5px;margin-top:10px;color:var(--accent)}
.mypauta dd{margin:2px 0 0;font-size:14.5px;color:var(--ink);white-space:pre-wrap;overflow-wrap:anywhere}
.mypauta .empty{color:var(--muted)}

/* Feedback */
dialog{border:0;border-radius:16px;padding:0;width:min(680px,calc(100vw - 24px));max-height:calc(100vh - 32px);background:var(--surface);color:var(--ink)}
dialog::backdrop{background:rgba(23,35,58,.55)}
.fbin{padding:26px;overflow-y:auto;max-height:calc(100vh - 32px)}
.fbin h2{font-size:24px;margin-bottom:14px}
.loading{padding:36px 0;text-align:center;color:var(--muted)}
.avg{display:flex;align-items:center;gap:18px;padding:16px 18px;background:var(--soft);border:1px solid var(--line);border-radius:12px;margin-bottom:18px}
.avg .num{font-family:var(--display);font-weight:700;font-size:52px;line-height:1;color:var(--accent)}
.avg .cap{display:flex;flex-direction:column;gap:2px}
.avg .cap .ver{color:var(--ink);font-size:15.5px}
.checks{list-style:none;display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 0;padding:0}
.checks li{font-size:14px;font-weight:600;padding:3px 11px;border-radius:99px;border:1px solid var(--line)}
.checks li.ok{background:#E4F3EC;border-color:#A9D7C0;color:#17523D}
.checks li.no{background:#F5F7FA;color:var(--muted)}
.aspect{padding:14px 0;border-top:1px solid var(--line)}
.aspect .row{display:flex;justify-content:space-between;gap:12px;font-weight:600}
.bar{height:8px;background:#E3E8EF;border-radius:99px;margin:8px 0;overflow:hidden}
.bar b{display:block;height:100%;background:var(--accent);border-radius:99px}
.aspect p{margin:0;color:var(--ink);font-size:15.5px}
.tips{margin:20px 0 0;padding:16px 18px;background:var(--soft);border-left:4px solid var(--accent);border-radius:0 10px 10px 0}
.tips h3{font-size:18px;margin-bottom:8px}
.tips ul{margin:0;padding-left:20px}
.tips li{margin-bottom:8px}
.fbactions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;flex-wrap:wrap}

@media (max-width:900px){
  .cards{grid-template-columns:1fr}
  .chatgrid{grid-template-columns:1fr}
  .side{order:-1}
  .tools{flex-direction:row;flex-wrap:wrap}
  .tools .btn{flex:1 1 150px;width:auto}
  .chat{height:70vh}
}
@media (max-width:520px){
  .top,main{padding-left:16px;padding-right:16px}
  .msg{max-width:90%}
  .stepper li{padding:4px 8px}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
</style>
</head>
<body>

<header class="top">
  <div class="brand">Práctica de conversaciones</div>
  <ol class="stepper" id="stepper" aria-label="Progreso">
    <li>1 Tipo</li><li>2 Preparación</li><li>3 Práctica</li>
  </ol>
</header>

<main>
  <!-- PASO 1 -->
  <section id="step1" aria-labelledby="h-step1">
    <div class="lead">
      <h1 id="h-step1">Diseña y practica tu próxima conversación</h1>
      <p>Elige el tipo de conversación que necesitas tener. Luego la prepararás y la ensayarás con una simulación.</p>
    </div>
    <div class="cards" id="cards"></div>
  </section>

  <!-- PASO 2 -->
  <section id="step2" hidden aria-labelledby="h-step2">
    <div class="formwrap">
      <button class="backlink" id="back1" type="button">Cambiar tipo de conversación</button>
      <div class="formhead"><span class="acr" id="f-acr"></span><h1 id="h-step2"></h1></div>
      <p class="sub" id="f-sub"></p>
      <form id="form" class="panel" autocomplete="off"></form>
    </div>
  </section>

  <!-- PASO 3 -->
  <section id="step3" hidden aria-label="Simulación de la conversación">
    <div class="chatgrid">
      <div class="chat">
        <div class="chathead">
          <div class="avatar" id="avatar"></div>
          <div><div class="who" id="who"></div><div class="role" id="role"></div></div>
        </div>
        <div class="log" id="log" aria-live="polite"></div>
        <p class="errorbar" id="err" role="alert" hidden></p>
        <div class="composer">
          <textarea id="input" rows="1" placeholder="Escribe tu mensaje…" aria-label="Tu mensaje"></textarea>
          <button class="btn primary" id="send" type="button">Enviar</button>
        </div>
      </div>
      <aside class="side">
        <div class="tools">
          <button class="btn" id="btn-restart" type="button">Reiniciar conversación</button>
          <button class="btn" id="btn-exit" type="button">Salir del ejemplo</button>
          <button class="btn primary" id="btn-fb" type="button">Pedir feedback</button>
        </div>
        <details class="mypauta" id="mypauta" open>
          <summary>Mi pauta</summary>
          <dl id="pautalist"></dl>
        </details>
      </aside>
    </div>
  </section>
</main>

<dialog id="fb" aria-labelledby="fb-title">
  <div class="fbin" id="fb-body"></div>
</dialog>

<script>
const MODELS = {
  GROW:{
    color:'#1F7A5C', acr:'GROW', expand:'Goal, Reality, Options, Will',
    title:'Conversación de desarrollo',
    desc:'Hablar con la otra persona para apoyar su desarrollo. El foco está en su crecimiento: qué quiere y puede llegar a ser esta persona y qué la está frenando.',
    sub:'Prepara una conversación para acompañar el crecimiento de otra persona. Completa la pauta con preguntas más que con respuestas.',
    situationHint:'¿Quién es esta persona, en qué momento profesional está y por qué quieres conversar sobre su desarrollo?',
    steps:[
      {k:'G',name:'Goal (Meta)',q:'¿Qué meta o aspiración de desarrollo tiene (o podría tener) esta persona? ¿Qué le preguntarás para que la ponga en palabras?'},
      {k:'R',name:'Reality (Realidad)',q:'¿Cómo está hoy respecto de esa meta? ¿Qué le está frenando y qué preguntas le harás para que lo vea con claridad?'},
      {k:'O',name:'Options (Opciones)',q:'¿Qué caminos podría explorar para acercarse a su meta? ¿Qué preguntas le harás para que sea esta persona quien los descubra?'},
      {k:'W',name:'Will (Voluntad)',q:'¿Qué elegirá hacer y para cuándo? ¿Qué apoyo necesita de ti y cómo sabrán que avanzó?'}
    ]
  },
  SBI:{
    color:'#2456A6', acr:'SBI', expand:'Situación, Conducta, Impacto + siguiente paso',
    title:'Conversación de feedback',
    desc:'Hay un comportamiento concreto que nombrar, positivo o constructivo, con un ancla específica.',
    sub:'Prepara un feedback basado en un hecho concreto. Cuanto más observable sea lo que describes, más fácil será conversarlo.',
    situationHint:'¿Qué ocurrió y por qué quieres conversarlo con esta persona?',
    steps:[
      {k:'S',name:'Situación (el momento concreto)',q:'¿En qué momento y lugar concreto ocurrió? Por ejemplo: "en la reunión del martes con el cliente".'},
      {k:'B',name:'Conducta',q:'¿Qué hizo o dijo exactamente? Describe lo que cualquiera habría visto u oído, sin interpretaciones ni juicios.'},
      {k:'I',name:'Impacto',q:'¿Qué efecto tuvo esa conducta en los resultados, en el equipo o en ti? ¿Cómo le preguntarás cómo lo vivió?'},
      {k:'+',name:'Siguiente paso',q:'¿Qué le pedirás o acordarán para repetirlo (si fue positivo) o para ajustarlo (si fue constructivo)?'}
    ]
  },
  CEDAR:{
    color:'#8A3F7B', acr:'CEDAR', expand:'Contexto, Ejemplos, Diagnóstico, Acción, Revisión',
    title:'Conversación de rendimiento',
    desc:'Hay un patrón que se repite y ya no puede ignorarse: afecta a los resultados y al equipo.',
    sub:'Prepara una conversación sobre un patrón de rendimiento. Llega con ejemplos concretos y con curiosidad por la mirada de la otra persona.',
    situationHint:'¿Qué patrón se repite y por qué ya no puede ignorarse?',
    steps:[
      {k:'C',name:'Contexto',q:'¿Qué se espera de esta persona en su rol y qué hace necesario conversar ahora?'},
      {k:'E',name:'Ejemplos',q:'¿Qué dos o tres ejemplos concretos (fechas, hechos, resultados) muestran el patrón?'},
      {k:'D',name:'Diagnóstico',q:'¿Qué crees que explica el patrón (claridad, habilidades, motivación, carga, recursos)? ¿Qué le preguntarás para contrastarlo con su mirada?'},
      {k:'A',name:'Acción',q:'¿Qué acciones concretas harán para cambiar el patrón, cada uno por su lado? ¿Qué te toca a ti?'},
      {k:'R',name:'Revisión',q:'¿Cuándo volverán a reunirse y qué señal mostrará que el patrón cambió?'}
    ]
  }
};

const $ = (s, r=document) => r.querySelector(s);
const state = { model:null, data:null, messages:[], busy:false };

/* ---------- Navegación ---------- */
function goTo(step){
  ['step1','step2','step3'].forEach((id,i)=>{ $('#'+id).hidden = (i+1)!==step; });
  [...$('#stepper').children].forEach((li,i)=>{
    li.classList.toggle('done', i+1<step);
    if(i+1===step) li.setAttribute('aria-current','step'); else li.removeAttribute('aria-current');
  });
  window.scrollTo({top:0});
}
function setAccent(color){ document.documentElement.style.setProperty('--accent', color); }

/* ---------- Paso 1 ---------- */
function renderCards(){
  const box = $('#cards'); box.innerHTML='';
  Object.entries(MODELS).forEach(([id,m])=>{
    const b = document.createElement('button');
    b.type='button'; b.className='card'; b.style.setProperty('--c', m.color);
    b.innerHTML = `<span class="acr">${m.acr}</span><span class="expand">${m.expand}</span><h2>${m.title}</h2><p>${m.desc}</p><span class="go">Elegir ${m.acr}</span>`;
    b.addEventListener('click', ()=>pickModel(id));
    box.appendChild(b);
  });
}

/* ---------- Paso 2 ---------- */
function pickModel(id){
  state.model = id; const m = MODELS[id];
  setAccent(m.color);
  $('#f-acr').textContent = m.acr;
  $('#h-step2').textContent = m.title;
  $('#f-sub').textContent = m.sub;
  buildForm(m);
  goTo(2);
  $('#f-name').focus();
}

function buildForm(m){
  const f = $('#form');
  const fbType = state.model==='SBI' ? `
    <div class="field">
      <label for="f-type">Tipo de feedback</label>
      <span class="hint">¿Vas a reconocer algo que salió bien o a plantear algo que debe ajustarse?</span>
      <select id="f-type" name="tipo">
        <option value="constructivo">Constructivo</option>
        <option value="positivo">Positivo</option>
      </select>
    </div>` : '';
  f.innerHTML = `
    <div class="field">
      <label for="f-name">Nombre de la persona</label>
      <span class="hint">Con quién vas a tener la conversación.</span>
      <input type="text" id="f-name" name="nombre" required maxlength="80">
    </div>
    ${fbType}
    <div class="field">
      <label for="f-sit">Situación</label>
      <span class="hint">${m.situationHint}</span>
      <textarea id="f-sit" name="situacion" required maxlength="2000" rows="4"></textarea>
    </div>
    <div class="field">
      <label for="f-persona">Cómo es esta persona (opcional)</label>
      <span class="hint">Cargo, personalidad, cómo suele reaccionar. Ayuda a que la simulación se parezca a la real.</span>
      <textarea id="f-persona" name="persona" maxlength="800" rows="2"></textarea>
    </div>
    <div class="pautahead">
      <h2>Tu pauta ${m.acr}</h2>
      <p>Completa cada paso. Es tu guía para la conversación y la usaremos al darte feedback.</p>
    </div>
    ${m.steps.map((s,i)=>`
      <div class="step-row">
        <div class="badge">${s.k}</div>
        <div class="field">
          <label for="p-${i}">${s.name}</label>
          <span class="hint">${s.q}</span>
          <textarea id="p-${i}" data-i="${i}" maxlength="1200" rows="2"></textarea>
        </div>
      </div>`).join('')}
    <div class="actions">
      <button class="btn primary" type="submit">Comenzar conversación</button>
      <button class="btn quiet" type="button" id="back1b">Volver</button>
    </div>`;
  $('#back1b').addEventListener('click', backToStart);
}

function backToStart(){ state.model=null; goTo(1); }

$('#form').addEventListener('submit', e=>{
  e.preventDefault();
  const f = e.target, m = MODELS[state.model];
  state.data = {
    nombre: f.nombre.value.trim(),
    situacion: f.situacion.value.trim(),
    persona: f.persona.value.trim(),
    tipoFeedback: f.tipo ? f.tipo.value : '',
    pauta: m.steps.map((s,i)=>({ etiqueta:`${s.k} — ${s.name}`, respuesta: $('#p-'+i).value.trim() }))
  };
  startChat();
});

/* ---------- Paso 3 ---------- */
function startChat(){
  const d = state.data, m = MODELS[state.model];
  setAccent(m.color);
  $('#avatar').textContent = d.nombre.charAt(0).toUpperCase();
  $('#who').textContent = d.nombre;
  $('#role').textContent = `Simulación ${m.acr}`;
  renderPauta();
  resetChat();
  goTo(3);
  $('#input').focus();
}

function renderPauta(){
  const dl = $('#pautalist'); dl.innerHTML='';
  state.data.pauta.forEach(p=>{
    const dt = document.createElement('dt'); dt.textContent = p.etiqueta;
    const dd = document.createElement('dd');
    if(p.respuesta){ dd.textContent = p.respuesta; } else { dd.textContent='Sin completar'; dd.className='empty'; }
    dl.append(dt, dd);
  });
}

function resetChat(){
  state.messages = []; state.busy = false;
  const log = $('#log'); log.innerHTML='';
  const n = document.createElement('div'); n.className='note'; n.id='startnote';
  n.textContent = `La conversación parte contigo. Escribe tu primer mensaje para ${state.data.nombre}.`;
  log.appendChild(n);
  hideError(); setBusy(false);
  $('#input').value=''; autosize();
}

function addMsg(role, text){
  const n = $('#startnote'); if(n) n.remove();
  const d = document.createElement('div'); d.className = 'msg '+role; d.textContent = text;
  $('#log').appendChild(d); scrollLog(); return d;
}
function scrollLog(){ const l=$('#log'); l.scrollTop = l.scrollHeight; }
function showTyping(){ const t=document.createElement('div'); t.className='typing'; t.id='typing'; t.setAttribute('aria-label','Escribiendo'); t.innerHTML='<i></i><i></i><i></i>'; $('#log').appendChild(t); scrollLog(); }
function hideTyping(){ const t=$('#typing'); if(t) t.remove(); }
function showError(msg){ const e=$('#err'); e.textContent=msg; e.hidden=false; }
function hideError(){ $('#err').hidden = true; }
function setBusy(b){
  state.busy=b;
  ['#send','#btn-fb','#btn-restart'].forEach(s=>{ $(s).disabled=b; });
}
function autosize(){ const t=$('#input'); t.style.height='auto'; t.style.height=Math.min(t.scrollHeight,140)+'px'; }

function ctx(){
  const d=state.data;
  return { modelo:state.model, nombre:d.nombre, situacion:d.situacion, persona:d.persona, tipoFeedback:d.tipoFeedback, pauta:d.pauta };
}

async function api(payload){
  const headers = {'Content-Type':'application/json'};
  let code=''; try{ code = sessionStorage.getItem('acceso')||''; }catch(e){}
  if(code) headers['x-access-code']=code;
  let res;
  try{ res = await fetch('/api/chat',{method:'POST',headers,body:JSON.stringify(payload)}); }
  catch(e){ throw new Error('No hay conexión con el servidor. Revisa tu internet e intenta de nuevo.'); }
  if(res.status===401){
    const c = prompt('Ingresa el código de acceso del programa:');
    if(c){ try{ sessionStorage.setItem('acceso',c); }catch(e){} return api(payload); }
    throw new Error('Se requiere el código de acceso del programa.');
  }
  const data = await res.json().catch(()=>({}));
  if(!res.ok) throw new Error(data.error || 'Ocurrió un error. Intenta de nuevo.');
  return data;
}

async function send(){
  if(state.busy) return;
  const text = $('#input').value.trim();
  if(!text) return;
  hideError();
  $('#input').value=''; autosize();
  state.messages.push({role:'user',content:text});
  const bubble = addMsg('user', text);
  setBusy(true); showTyping();
  try{
    const r = await api({type:'chat', context:ctx(), messages:state.messages});
    hideTyping();
    state.messages.push({role:'assistant',content:r.reply});
    addMsg('them', r.reply);
  }catch(e){
    hideTyping();
    state.messages.pop(); bubble.remove();
    $('#input').value = text; autosize();
    showError(e.message);
  }finally{
    setBusy(false); $('#input').focus();
  }
}

$('#send').addEventListener('click', send);
$('#input').addEventListener('input', autosize);
$('#input').addEventListener('keydown', e=>{
  if(e.key==='Enter' && !e.shiftKey && !e.isComposing){ e.preventDefault(); send(); }
});

$('#btn-restart').addEventListener('click', ()=>{
  if(state.messages.length && !confirm('¿Reiniciar la conversación? Se borrará lo escrito hasta ahora, pero conservarás tu pauta.')) return;
  resetChat(); $('#input').focus();
});
$('#btn-exit').addEventListener('click', ()=>{
  if(!confirm('¿Salir del ejemplo? Volverás al inicio y se perderá esta conversación y su pauta.')) return;
  exitExample();
});
$('#back1').addEventListener('click', backToStart);

/* ---------- Feedback ---------- */
const fbDialog = $('#fb'), fbBody = $('#fb-body');

async function askFeedback(){
  if(state.busy) return;
  const turns = state.messages.filter(m=>m.role==='user').length;
  if(turns<2){ showError('Conversa un poco más antes de pedir feedback: necesito al menos dos intervenciones tuyas.'); return; }
  hideError();
  fbBody.innerHTML = `<h2 id="fb-title">Feedback de tu conversación</h2><div class="loading">Analizando tu conversación…</div>`;
  if(!fbDialog.open) fbDialog.showModal();
  setBusy(true);
  try{
    const r = await api({type:'feedback', context:ctx(), messages:state.messages});
    renderFeedback(r.feedback);
  }catch(e){
    fbBody.innerHTML = `<h2 id="fb-title">Feedback de tu conversación</h2>`;
    const p = document.createElement('p'); p.textContent = e.message; p.style.color='#8A1F1F';
    const acts = document.createElement('div'); acts.className='fbactions';
    const retry = document.createElement('button'); retry.className='btn primary'; retry.textContent='Intentar de nuevo';
    retry.addEventListener('click', ()=>{ setBusy(false); askFeedback(); });
    const close = document.createElement('button'); close.className='btn'; close.textContent='Cerrar';
    close.addEventListener('click', ()=>fbDialog.close());
    acts.append(retry, close); fbBody.append(p, acts);
  }finally{ setBusy(false); }
}

function exitExample(){
  if(fbDialog.open) fbDialog.close();
  state.model=null; state.data=null; state.messages=[];
  goTo(1);
}

function renderFeedback(fb){
  const aspects = (fb.aspectos||[]).slice(0,5).map(a=>({
    nombre:String(a.nombre||''), puntaje:Math.max(0,Math.min(100,Math.round(Number(a.puntaje)||0))), comentario:String(a.comentario||'')
  }));
  const avg = aspects.length ? Math.round(aspects.reduce((s,a)=>s+a.puntaje,0)/aspects.length) : 0;
  fbBody.innerHTML = '';
  const h = document.createElement('h2'); h.id='fb-title'; h.textContent='Feedback de tu conversación';
  const box = document.createElement('div'); box.className='avg';
  box.innerHTML = `<div class="num">${avg}%</div><div class="cap"><strong>Promedio final</strong><span class="ver"></span></div>`;
  const ver = box.querySelector('.ver');
  ver.textContent = fb.veredicto ? String(fb.veredicto) : `Práctica ${MODELS[state.model].acr} con ${state.data.nombre}.`;
  fbBody.append(h, box);

  const steps = MODELS[state.model].steps;
  const pasos = Array.isArray(fb.pasos) ? fb.pasos : [];
  aspects.forEach((a,idx)=>{
    const el = document.createElement('div'); el.className='aspect';
    el.innerHTML = `<div class="row"><span class="n"></span><span>${a.puntaje}%</span></div><div class="bar"><b style="width:${a.puntaje}%"></b></div><p class="c"></p>`;
    el.querySelector('.n').textContent = a.nombre;
    el.querySelector('.c').textContent = a.comentario;
    if(idx===3 && pasos.length){
      const ul = document.createElement('ul'); ul.className='checks'; ul.setAttribute('aria-label','Pasos del modelo');
      steps.forEach((s,i)=>{
        const ok = !!(pasos[i] && pasos[i].cumple);
        const li = document.createElement('li'); li.className = ok ? 'ok' : 'no';
        li.textContent = (ok ? '✓ ' : '✗ ') + s.name.split(' (')[0];
        li.title = ok ? 'Paso cumplido' : 'Paso que faltó';
        ul.appendChild(li);
      });
      el.appendChild(ul);
    }
    fbBody.appendChild(el);
  });
  const tips = (fb.tips||[]).slice(0,3);
  if(tips.length){
    const t = document.createElement('div'); t.className='tips';
    t.innerHTML = '<h3>Tres tips para tu próxima conversación</h3><ul></ul>';
    tips.forEach(x=>{ const li=document.createElement('li'); li.textContent=String(x); t.querySelector('ul').appendChild(li); });
    fbBody.appendChild(t);
  }
  const acts = document.createElement('div'); acts.className='fbactions';
  const exit = document.createElement('button'); exit.className='btn'; exit.textContent='Salir del ejemplo';
  exit.addEventListener('click', exitExample);
  const close = document.createElement('button'); close.className='btn primary'; close.textContent='Seguir practicando';
  close.addEventListener('click', ()=>fbDialog.close());
  acts.append(exit, close); fbBody.appendChild(acts);
  fbBody.scrollTop = 0;
}

$('#btn-fb').addEventListener('click', askFeedback);

/* ---------- Inicio ---------- */
renderCards();
goTo(1);
</script>
